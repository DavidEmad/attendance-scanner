<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توليد QR Codes للطلاب</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --accent: #2563eb;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 24px;
  }
  textarea {
    width: 100%;
    min-height: 140px;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 12px;
    font-family: monospace;
    font-size: 0.9rem;
    resize: vertical;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 10px;
  }
  button:hover { opacity: 0.92; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .btn-row button { margin-top: 0; }
  .status-msg { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .qr-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    break-inside: avoid;
  }
  .qr-card .qr-box { display: flex; justify-content: center; margin-bottom: 8px; }
  .qr-card .name { font-weight: 700; font-size: 0.95rem; }
  .qr-card .id { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  .qr-card .download-btn {
    margin-top: 10px;
    width: 100%;
    padding: 8px;
    font-size: 0.8rem;
    background: #0f172a;
    border-radius: 8px;
  }
  @media print {
    .panel.controls, h1, p.sub, .download-btn { display: none; }
    body { padding: 0; background: white; }
    .qr-card { box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🎫 توليد QR Codes للطلاب</h1>
    <p class="sub">الصق قائمة الطلاب (سطر لكل طالب) بالصيغة: <code>StudentID,Name</code> — نفس القيم اللي في شيت Students</p>

    <div class="panel controls">
      <textarea id="studentInput" placeholder="1001,أحمد محمد&#10;1002,منى علي&#10;1003,كريم حسن"></textarea>
      <input type="file" id="fileImport" accept=".txt,.csv" style="display:none" onchange="handleFileImport(event)">
      <div class="btn-row">
        <button onclick="document.getElementById('fileImport').click()" style="background:#7c3aed;">📁 استيراد من ملف نصي</button>
        <button onclick="generateCodes()">توليد QR Codes</button>
        <button onclick="window.print()" style="background:#0f172a;">🖨️ طباعة</button>
        <button onclick="downloadAll()" style="background:#16a34a;">⬇️ تحميل الكل (صور)</button>
        <button onclick="exportToWord()" style="background:#1d4ed8;">📄 تصدير Word للطباعة</button>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

<script>
  function generateCodes() {
    const raw = document.getElementById('studentInput').value.trim();
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    if (!raw) return;

    const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);

    lines.forEach(line => {
      const parts = line.split(',');
      if (parts.length < 2) return;
      const id = parts[0].trim();
      const name = parts.slice(1).join(',').trim();

      const card = document.createElement('div');
      card.className = 'qr-card';

      const qrBox = document.createElement('div');
      qrBox.className = 'qr-box';
      card.appendChild(qrBox);

      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = name;
      card.appendChild(nameEl);

      const idEl = document.createElement('div');
      idEl.className = 'id';
      idEl.textContent = 'ID: ' + id;
      card.appendChild(idEl);

      const downloadBtn = document.createElement('button');
      downloadBtn.className = 'download-btn';
      downloadBtn.textContent = '⬇️ تحميل';
      downloadBtn.onclick = () => downloadQR(qrBox, name, id);
      card.appendChild(downloadBtn);

      grid.appendChild(card);

      new QRCode(qrBox, {
        text: id,
        width: 140,
        height: 140
      });
    });
  }

  // بيحول أي حرف ممنوع في أسماء الملفات لـ "_"
  function sanitizeFilename(str) {
    return str.replace(/[\\/:*?"<>|]/g, '').trim().replace(/\s+/g, '_');
  }

  function downloadQR(qrBox, name, id) {
    // qrcodejs بيعمل canvas جوه الـ div، وده اللي هنحوله لصورة
    const canvas = qrBox.querySelector('canvas');
    if (!canvas) {
      alert('لسه الـ QR مش جاهز');
      return;
    }
    const filename = sanitizeFilename(name) + '_' + sanitizeFilename(id) + '.png';
    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function downloadAll() {
    const cards = document.querySelectorAll('.qr-card');
    if (!cards.length) {
      alert('اعمل توليد QR Codes الأول');
      return;
    }
    // تأخير بسيط بين كل تحميل عشان المتصفح ميحظرش التحميلات المتتالية
    cards.forEach((card, i) => {
      setTimeout(() => {
        const qrBox = card.querySelector('.qr-box');
        const name = card.querySelector('.name').textContent;
        const id = card.querySelector('.id').textContent.replace('ID: ', '');
        downloadQR(qrBox, name, id);
      }, i * 300);
    });
  }

  function setStatus(msg) {
    document.getElementById('statusMsg').textContent = msg;
  }

  // ---- استيراد من ملف نصي (txt / csv) ----
  function handleFileImport(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      document.getElementById('studentInput').value = e.target.result.trim();
      setStatus('تم استيراد الملف: ' + file.name);
      generateCodes();
    };
    reader.onerror = () => setStatus('❌ مش قادر أقرأ الملف');
    reader.readAsText(file, 'UTF-8');
    event.target.value = ''; // عشان لو استوردت نفس الملف تاني يشتغل تاني
  }

  // ---- تصدير Word فيه كل الـ QR Codes مرتبة جنب بعض للطباعة والقص ----
  async function exportToWord() {
    const cards = document.querySelectorAll('.qr-card');
    if (!cards.length) {
      alert('اعمل توليد QR Codes الأول');
      return;
    }
    if (typeof docx === 'undefined') {
      alert('مكتبة Word مش محملة، تأكد إنك متصل بالنت وجرب تاني');
      return;
    }

    setStatus('جاري إنشاء ملف Word...');

    const {
      Document, Packer, Table, TableRow, TableCell, Paragraph, TextRun,
      ImageRun, WidthType, AlignmentType, BorderStyle, VerticalAlign
    } = docx;

    const COLS = 4; // عدد الأعمدة في الجدول - غيّرها لو عايز أكبر/أصغر
    const rows = [];
    let currentRowCells = [];

    function dataUrlToBytes(dataUrl) {
      const base64 = dataUrl.split(',')[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
      return bytes;
    }

    const dashedBorder = { style: BorderStyle.DASHED, size: 4, color: '999999' };

    function emptyCell() {
      return new TableCell({
        children: [new Paragraph('')],
        borders: { top: dashedBorder, bottom: dashedBorder, left: dashedBorder, right: dashedBorder }
      });
    }

    cards.forEach((card, i) => {
      const canvas = card.querySelector('canvas');
      const name = card.querySelector('.name').textContent;
      const id = card.querySelector('.id').textContent.replace('ID: ', '');
      const bytes = dataUrlToBytes(canvas.toDataURL('image/png'));

      const cell = new TableCell({
        children: [
          new Paragraph({
            alignment: AlignmentType.CENTER,
            children: [ new ImageRun({ data: bytes, transformation: { width: 110, height: 110 } }) ]
          }),
          new Paragraph({
            alignment: AlignmentType.CENTER,
            spacing: { before: 60 },
            children: [ new TextRun({ text: name, bold: true, size: 20 }) ]
          }),
          new Paragraph({
            alignment: AlignmentType.CENTER,
            children: [ new TextRun({ text: 'ID: ' + id, size: 16, color: '666666' }) ]
          })
        ],
        verticalAlign: VerticalAlign.CENTER,
        margins: { top: 150, bottom: 150, left: 100, right: 100 },
        borders: { top: dashedBorder, bottom: dashedBorder, left: dashedBorder, right: dashedBorder }
      });

      currentRowCells.push(cell);

      if (currentRowCells.length === COLS || i === cards.length - 1) {
        while (currentRowCells.length < COLS) currentRowCells.push(emptyCell());
        rows.push(new TableRow({ children: currentRowCells }));
        currentRowCells = [];
      }
    });

    const table = new Table({
      rows: rows,
      width: { size: 100, type: WidthType.PERCENTAGE }
    });

    const doc = new Document({
      sections: [{ properties: {}, children: [table] }]
    });

    try {
      const blob = await Packer.toBlob(doc);
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'qr_codes.docx';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setStatus('✅ تم تحميل ملف Word');
    } catch (err) {
      setStatus('❌ حصل خطأ أثناء إنشاء الملف: ' + err.message);
    }
  }
</script>
</body>
</html>
